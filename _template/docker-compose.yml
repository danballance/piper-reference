services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend/api:/app/api
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - api-venv:/app/.venv
    command: >
      sh -c "
        pip install uv --quiet &&
        uv sync --frozen --no-dev &&
        uv run uvicorn api.main:app --reload --host 0.0.0.0 --port 8080
      "
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8080)); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  ui:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./ui:/app
      - ./schema:/schema
      - ui-node-modules:/app/node_modules
      - ui-pnpm-store:/app/.pnpm-store
    command: >
      sh -c "
        corepack enable pnpm &&
        pnpm install --frozen-lockfile &&
        pnpm run codegen &&
        pnpm dev --host
      "
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5173/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./ui/Caddyfile.dev:/etc/caddy/Caddyfile
    environment:
      PORT: 3000
      BACKEND_URL: api:8080
      FRONTEND_URL: ui:5173
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /app
    volumes:
      - ./ui:/app
      - playwright-node-modules:/app/node_modules
    command: >
      sh -c "
        corepack enable pnpm &&
        pnpm install --frozen-lockfile &&
        pnpm test:e2e
      "
    environment:
      PLAYWRIGHT_BASE_URL: http://caddy:3000
    depends_on:
      caddy:
        condition: service_healthy
    profiles:
      - test

volumes:
  api-venv:
  ui-node-modules:
  ui-pnpm-store:
  playwright-node-modules:
