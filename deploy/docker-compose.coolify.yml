services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    expose:
      - "8080"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    expose:
      - "80"
    environment:
      PORT: "80"
      BACKEND_URL: api:8080
    depends_on:
      - api
    restart: unless-stopped
