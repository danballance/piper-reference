name: CI & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for private packages
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # Template-aware: generate from template if copier.yml exists
      - name: Generate project from template
        if: hashFiles('copier.yml') != ''
        run: |
          pip install copier
          copier copy --defaults --trust --vcs-ref HEAD ./ ./build

      - name: Set working directory
        id: workdir
        run: |
          if [ -d ./build ]; then
            echo "dir=./build" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install piper-py
        run: uv tool install "piper-py @ git+https://github.com/danballance/pied-piper.git#subdirectory=py"

      - name: Install backend dependencies
        run: cd ${{ steps.workdir.outputs.dir }}/backend && uv sync

      - name: Run backend tests
        run: cd ${{ steps.workdir.outputs.dir }}/backend && uv run pytest -m "not schemathesis" -v

      - name: Run backend schema tests
        run: cd ${{ steps.workdir.outputs.dir }}/backend && uv run pytest -m schemathesis -v

      - name: Run backend linting
        run: piper-py -d ${{ steps.workdir.outputs.dir }}/backend check fast

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.workdir.outputs.dir }}/ui/pnpm-lock.yaml

      - name: Install piper-ts
        run: |
          git clone --depth 1 https://github.com/danballance/pied-piper.git /tmp/pied-piper
          cd /tmp/pied-piper/ts && npm install && npm run build && npm install -g .

      - name: Install frontend dependencies
        run: cd ${{ steps.workdir.outputs.dir }}/ui && pnpm install --frozen-lockfile

      - name: Run frontend linting
        run: piper-ts -d ${{ steps.workdir.outputs.dir }}/ui check fast

      - name: Start Docker Compose stack
        run: docker compose -f ${{ steps.workdir.outputs.dir }}/docker-compose.yml up -d --wait --wait-timeout 120 api ui caddy
        timeout-minutes: 5

      - name: Run E2E tests
        run: docker compose -f ${{ steps.workdir.outputs.dir }}/docker-compose.yml --profile test run --rm playwright
        timeout-minutes: 5

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ steps.workdir.outputs.dir }}/ui/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f ${{ steps.workdir.outputs.dir }}/docker-compose.yml down -v --remove-orphans

  publish-backend:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for private packages
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Generate project from template
        if: hashFiles('copier.yml') != ''
        run: |
          pip install copier
          copier copy --defaults --trust --vcs-ref HEAD ./ ./build

      - name: Set build context
        id: ctx
        run: |
          if [ -d ./build/backend ]; then
            echo "context=./build/backend" >> "$GITHUB_OUTPUT"
          else
            echo "context=./backend" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-ui:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for private packages
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Generate project from template
        if: hashFiles('copier.yml') != ''
        run: |
          pip install copier
          copier copy --defaults --trust --vcs-ref HEAD ./ ./build

      - name: Set build paths
        id: ctx
        run: |
          if [ -d ./build/ui ]; then
            echo "context=./build" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./build/ui/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=./ui/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
