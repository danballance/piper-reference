services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./api:/app/api
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./README.md:/app/README.md
      - api-venv:/app/.venv
    command: >
      sh -c "
        pip install uv --quiet &&
        uv sync --frozen --no-dev &&
        uv run uvicorn api.main:app --reload --host 0.0.0.0 --port 8080
      "
    expose:
      - "8080"

  ui:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./ui:/app
      - ./schema:/schema
      - ui-node-modules:/app/node_modules
      - ui-pnpm-store:/app/.pnpm-store
    command: >
      sh -c "
        corepack enable pnpm &&
        pnpm install --frozen-lockfile &&
        pnpm run codegen &&
        pnpm dev --host
      "
    expose:
      - "5173"

  caddy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./ui/Caddyfile.dev:/etc/caddy/Caddyfile
    environment:
      PORT: 3000
      BACKEND_URL: api:8080
      FRONTEND_URL: ui:5173
    depends_on:
      - api
      - ui

volumes:
  api-venv:
  ui-node-modules:
  ui-pnpm-store:
